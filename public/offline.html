<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline · Smart Mess Manager</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #020617;
        color: #fff;
      }
      .card {
        width: min(92vw, 480px);
        border: 1px solid #1e293b;
        border-radius: 28px;
        padding: 32px;
        background: #0f172a;
        box-shadow: 0 24px 70px rgba(0,0,0,.35);
        text-align: center;
      }
      .logo {
        width: 64px;
        height: 64px;
        margin: 0 auto 18px;
        border-radius: 22px;
        display: grid;
        place-items: center;
        background: #059669;
        font-weight: 900;
        font-size: 26px;
      }
      h1 { margin: 0 0 12px; font-size: 28px; }
      p { color: #cbd5e1; line-height: 1.7; }
      button {
        margin-top: 18px;
        border: 0;
        border-radius: 14px;
        padding: 12px 18px;
        background: #10b981;
        color: #fff;
        font-weight: 800;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="logo">S</div>
      <h1>You are offline</h1>
      <p>
        Smart Mess Manager is offline-ready after the first successful load.
        Please reconnect once if this is your first visit, then the app will open offline.
      </p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
